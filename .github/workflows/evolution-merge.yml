name: Evolution approved merge
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Evolution pull request number, marked Ready for review
        required: true
      approved_commit:
        description: Personally approved full 40-character commit SHA
        required: true
permissions:
  contents: read
concurrency:
  group: evolution-approved-write
  cancel-in-progress: false
jobs:
  merge:
    if: github.actor == 'justappgrabbin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require owner approval and passing checks on the same commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pull_request }}
          APPROVED_SHA: ${{ inputs.approved_commit }}
          APPROVER: ${{ github.actor }}
        run: python scripts/evolution.py merge --pr "$PR" --sha "$APPROVED_SHA" --actor "$APPROVER"
