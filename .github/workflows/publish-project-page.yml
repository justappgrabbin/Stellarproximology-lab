name: Publish approved project page
on:
  workflow_dispatch:
    inputs:
      release_tag:
        required: true
        type: string
      bundle_sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    if: github.actor == 'justappgrabbin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify personally approved release bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          BUNDLE_SHA: ${{ inputs.bundle_sha256 }}
        run: |
          python - <<'PY'
          import hashlib, io, json, os, pathlib, re, urllib.request, zipfile
          tag, digest = os.environ['RELEASE_TAG'], os.environ['BUNDLE_SHA']
          assert re.fullmatch(r'local-model-[0-9a-f]{32}', tag)
          assert re.fullmatch(r'[0-9a-f]{64}', digest)
          url = 'https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/releases/tags/'+tag
          headers = {'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'}
          release = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=headers)))
          assert not release['draft']
          asset = next(a for a in release['assets'] if a['name']=='synthia-model-release.zip')
          headers['Accept']='application/octet-stream'
          data = urllib.request.urlopen(urllib.request.Request(asset['url'],headers=headers)).read()
          assert hashlib.sha256(data).hexdigest()==digest, 'Approved bundle changed'
          page = zipfile.ZipFile(io.BytesIO(data)).read('index.html')
          pathlib.Path('page').mkdir()
          pathlib.Path('page/index.html').write_bytes(page)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: page
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
