name: Modelmaker team control and notification verification
on:
  push:
    branches:
      - feature/modelmaker-team-dashboard-notifications
    paths:
      - 'Modelmaker-repair/assembly/team_control.py'
      - 'Modelmaker-repair/assembly/desktop_server.py'
      - 'Modelmaker-repair/computer/team_board.mjs'
      - 'Modelmaker-repair/computer/team_notifications_sw.js'
      - 'Modelmaker-repair/computer/workspace.mjs'
      - 'Modelmaker-repair/computer/index.html'
      - 'Modelmaker-repair/tests/test_team_control.py'
      - 'Modelmaker-repair/tests/test_team_api.py'
      - '.github/workflows/test-team-control.yml'
  pull_request:
    paths:
      - 'Modelmaker-repair/assembly/team_control.py'
      - 'Modelmaker-repair/assembly/desktop_server.py'
      - 'Modelmaker-repair/computer/team_board.mjs'
      - 'Modelmaker-repair/computer/team_notifications_sw.js'
      - 'Modelmaker-repair/computer/workspace.mjs'
      - 'Modelmaker-repair/computer/index.html'
      - 'Modelmaker-repair/tests/test_team_control.py'
      - '.github/workflows/test-team-control.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Modelmaker-repair
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate team code and server module
        run: python -m py_compile assembly/team_control.py assembly/desktop_server.py
      - name: Run behavioral accountability and privacy tests
        run: python -m unittest discover -s tests -p 'test_team_control.py' -v
      - name: Test real local FastAPI team endpoints
        run: |
          python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'python-multipart>=0.0.9' 'huggingface_hub>=0.28'
          python -m unittest discover -s tests -p 'test_team_api.py' -v
      - name: Validate workspace JavaScript
        run: |
          node --check computer/team_board.mjs
          node --check computer/team_notifications_sw.js
          node --check computer/workspace.mjs
