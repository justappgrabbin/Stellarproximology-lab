name: Native TRIDENT shared base and positional adapters

on:
  push:
    branches:
      - feature/dimension-source-research-team
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-positional-adapter-training:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU-native PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify unchanged TRIDENT donor source from main
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          expected = {
            'model.py': '6918430be9c286ef1f88923a677631b14f1330f1',
            'semantic_language_maker.py': '242082e610a87f8359eff49207e9b63dc8cda49c',
          }
          # Git blob SHA-1 proves the exact copied bytes from the original
          # Modelmaker main source, not a substituted neural architecture.
          for name, expected_sha in expected.items():
            raw = (Path('Modelmaker-repair/vendor/trident') / name).read_bytes()
            actual = hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()
            assert actual == expected_sha, (name,actual,expected_sha)
          PY
      - name: Verify native adapter code compiles
        run: python -m py_compile Modelmaker-repair/assembly/positional_trident.py Modelmaker-repair/assembly/desktop_server.py
      - name: Run real gradient, independent-weights and provenance tests
        working-directory: Modelmaker-repair
        run: python -m unittest discover -s tests -p 'test_positional_trident.py' -v
