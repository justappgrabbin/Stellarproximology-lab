name: Test TRIDENT Modelmaker
on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'training_core.py'
      - 'trident_inference.py'
      - 'source/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test-trident-modelmaker.yml'
  pull_request:
    paths:
      - 'app.py'
      - 'training_core.py'
      - 'trident_inference.py'
      - 'source/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/test-trident-modelmaker.yml'
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py training_core.py trident_inference.py source/
